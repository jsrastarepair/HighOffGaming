<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HighOffGaming</title>
  <base target="_parent" />
  <style>
    /* Reset & Background Setup */
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: cyan;
      background: #111; /* Fallback background color since old GIF is gone */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 2.5rem;
    }

    header h4 {
      margin: 0;
      font-size: 1.2rem;
    }

    /* Grid Layout for Links */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      width: 100%;
      max-width: 400px;
    }

    .links-container a {
      display: inline-block;
      text-decoration: none;
      color: cyan;
      transition: transform 0.2s ease;
    }

    .links-container a:hover {
      transform: scale(1.05);
    }

    /* Styled placeholders for your missing images */
    .links-container img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border: 5px solid cyan;
      border-radius: 8px;
      display: block;
      background: #222;
      text-align: center;
      line-height: 200px; /* Centers the text vertically */
      font-size: 0.9rem;
    }

    /* Footer Call/Text Button */
    .contact-btn {
      margin-top: 40px;
      padding: 12px 24px;
      background-color: cyan;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.2s;
    }

    .contact-btn:hover {
      background-color: #00cccc;
    }
  </style>
</head>
<body>

  <header>
    <h1>HighOffGaming</h1>
    <h4>What Brings You Here?</h4>
  </header>

  <main class="links-container">
    <a href="https://highoffgaming.bigcartel.com/">

    </a>

    <a href="https://soundcloud.com/fat2incher">

    <a href="https://twitch.com/highoffgaming">
      <img src="" alt="Twitch" />
    </a>
         
    <a href="https://www.youtube.com/channel/UCr5Ypn53y5-uFxKzeY81JaQ">

    </a>

    <a href="https://instagram.com/jsrastarepair/">
      <img src="" alt="Business Card" />
    </a>
         
    <a href="https://discord.gg/H9MBjaPg8w">
      <img src="" alt="Discord" />
    </a>
         
    <a href="https://twitter.com/highoffgaming">
      <img src="" alt="Twitter" />
    </a>
       
    <a href="https://www.tiktok.com/@highoffgaming">

    </a>
  </main>
   
  <a href="tel:240-628-4263" class="contact-btn">CALL / TEXT</a>

</body>
</html>
