  <style>
    /* Reset & Full Screen Layout */
    html, body {
      margin: 0;
      padding: 0;
      width: 200%;
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: cyan;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    /* FORCE BACKGROUND TO STRETCH AND COVER ANY SCREEN */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1; 
      pointer-events: none; 
      background-color: #111;
      overflow: hidden;
    }

    /* Overriding Tenor's container constraints */
    .bg-container .tenor-gif-embed {
      width: 100% !important;
      height: 100% !important;
      padding-bottom: 0 !important;
      margin: 0 !important;
    }
    
    /* Forcing the actual internal iframe to stretch like a full-screen background image */
    .bg-container iframe {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important; /* Stretches and scales to cover all edges */
      object-position: center !important;
    }

    /* Header Styling with Dark Shadow for Readability */
    header {
      text-align: center;
      margin-bottom: 40px;
      z-index: 1;
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 2.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 2px 2px 5px rgba(0, 0, 0, 1);
    }

    header h4 {
      margin: 0;
      font-size: 1.3rem;
      color: #fff;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 1px 1px 3px rgba(0, 0, 0, 1);
    }

    /* Layout for Link Buttons */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      width: 100%;
      max-width: 320px;
      z-index: 1;
    }

    /* Styled Text Buttons with Solid Background to stand out over the GIF */
    .links-container a {
      display: block;
      width: 100%;
      padding: 15px 0;
      text-align: center;
      text-decoration: none;
      color: cyan;
      font-weight: bold;
      font-size: 1.1rem;
      border: 2px solid cyan;
      border-radius: 8px;
      background: rgba(17, 17, 17, 0.85); /* Semi-transparent dark overlay for text readability */
      box-sizing: border-box;
      transition: all 0.2s ease;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Hover & Active Effects */
    .links-container a:hover {
      transform: scale(1.03);
      background: cyan;
      color: #111;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
      text-shadow: none;
    }

    /* Footer Call/Text Button */
    .contact-btn {
      margin-top: 50px;
      padding: 12px 30px;
      background-color: cyan;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: all 0.2s;
      z-index: 1;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .contact-btn:hover {
      background-color: #00cccc;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }
  </style>
</head>
